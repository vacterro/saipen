name: validate

# Runs the full conformance suite: canonical validator, both halves of the
# frozen portable floor, and the scenario fixtures.
#
# Triggers on push to main (the actual ship path) AND pull_request (someone
# else's branch). Concurrency group cancels redundant in-progress runs so the
# last push in a burst is the only one that finishes -- notifications for the
# cancelled ones never fire.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 fetches tags. The default shallow checkout has none,
      # and both jobs read the tag list: the validator treats tags as half
      # of the release ledger, and the release job decides "is this the
      # highest version" from it. Without tags the validator saw a partial
      # ledger and FAILed a legitimate citation, and `git fetch --tags`
      # against a shallow clone exited non-zero and killed the release job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Canonical validator: schema check, LOG event-graph walk across sealed
      # segments, runtime manifest, injector wiring, README badge vs VERSION.
      # Stdlib only -- no install step needed, by design (CONFORMANCE.md § 1).
      - name: Canonical validator (tools/validate.py)
        run: python tools/validate.py

      # The frozen portable floor still has to run clean too: it is what a
      # no-Python host falls back to, so a change that breaks it silently
      # degrades those hosts while CI stays green on the canonical path alone.
      - name: Frozen portable floor (tests/validate.sh)
        run: bash tests/validate.sh

      # The PowerShell half of that floor was executed by NOTHING until
      # v7.97.0 -- not this workflow, not the pre-commit hook (which falls
      # back to validate.sh only). That is exactly how it drifted apart from
      # its sibling: it matched `needs: (.*)` to end of line where the shell
      # script used `[^|]*`, so it FAILed a conformant board, and no run ever
      # noticed. pwsh ships on ubuntu-latest, so this costs a step, not a job.
      - name: Frozen portable floor (tests/validate.ps1)
        shell: pwsh
        run: ./tests/validate.ps1

      # The 43 fixtures in tests/scenarios/ sat unexecuted by anything until
      # v7.79.0 -- and could not have passed if run, since most shipped only
      # the one file their concept concerned. Each executable one now declares
      # `expect: pass|fail` in its README and this runner holds it to that. It
      # also fails on a fixture that declares nothing, and on collecting zero
      # fixtures at all, so it cannot quietly become a no-op.
      # tools/validate.py is the most load-bearing file in the repo and had
      # never been linted until v7.99.0. The first run found nine cp1251-mangled
      # section signs sitting in its own FAIL messages -- valid UTF-8, so the
      # validator's own U+FFFD check could not see them. ruff.toml documents a
      # reason for every rule that is switched off.
      - name: Lint (ruff)
        run: |
          python -m pip install --quiet ruff
          python -m ruff check tools/ tests/

      # Everything above runs the validator from the development layout, where
      # RFC.md sits in saipen/ next to tools/. Every actual USER runs the
      # injected layout, where the injector flattens RFC.md to tools/'s sibling
      # -- and nothing had ever executed that. It was broken twice over: an
      # unguarded VERSION read crashed with a traceback in any consuming
      # project that had run `saipen translate`, and every cross-document check
      # FAILed with "SAIPEN home clone incomplete". Install into a sandbox HOME
      # and run the copy, so the shipped configuration is a tested one.
      # The floor's own checks were verified by hand when they shipped and
      # nothing kept them verified -- the same shape as the LOG timestamp check
      # that lay dead in validate.py for months. This breaks a scratch project
      # one way per check and asserts the floor names that specific failure.
      - name: Portable floor still goes red (tools/audit_floor.py)
        run: python tools/audit_floor.py

      # release.yml's tag-vs-VERSION guard is forward-only: it was added
      # BECAUSE a tag had already reached origin pointing two releases behind,
      # and it can say nothing about the tags that were already there. This is
      # the sweep, in CI so it keeps happening -- a one-off sweep is not a
      # guard. Needs the full tag list, hence fetch-depth: 0 above.
      - name: Every tag agrees with its VERSION (tools/audit_tags.py)
        run: python tools/audit_tags.py

      # Three module-level use-before-define NameErrors landed in one day, all
      # in validate.py, all invisible locally: the branch reading the constant
      # only runs on an input this repo's own STATE.md does not produce. Ruff
      # cannot see them (the name IS bound, just later) and nothing else was
      # looking.
      - name: No tool reads a name before assigning it (tools/audit_order.py)
        run: python tools/audit_order.py

      # audit_floor.py proves the 20 portable-floor checks still go red.
      # Nothing did that for the canonical validator's ~160 failure paths, of
      # which the inputs this repo ships exercise about ten. Every other check
      # rested on a hand test from the day it was written -- and one in this
      # file lay dead from feae149 to v7.99.0 for exactly that reason.
      - name: Validator checks still go red (tools/audit_checks.py)
        run: python tools/audit_checks.py

      # Parity runs every mutation against BOTH tools, so it costs minutes
      # rather than seconds. The number it measures only moves when the floor
      # or the mutation table moves, so it runs when those files do -- a gate
      # nobody waits seven minutes for is a gate someone deletes.
      - name: Did the floor or the mutation table change?
        id: floor_touched
        run: |
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)"
          if echo "$changed" | grep -qE '^(tests/validate\.(sh|ps1)|tools/audit_checks\.py|tools/audit_parity\.py)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "floor untouched in this push -- parity not re-measured"
          fi

      - name: Floor parity (tools/audit_parity.py)
        if: steps.floor_touched.outputs.run == 'true'
        run: python tools/audit_parity.py

      - name: Installed layout (inject into a sandbox HOME, run the copy)
        run: |
          sandbox="$(mktemp -d)"
          mkdir -p "$sandbox/.claude" "$sandbox/proj"
          cp -r .saipen "$sandbox/proj/"
          HOME="$sandbox" bash bootstrap/inject.sh
          test -f "$sandbox/.claude/skills/saipen/tools/validate.py"             || { echo "::error::injector did not copy the skill"; exit 1; }
          cd "$sandbox/proj"
          python "$sandbox/.claude/skills/saipen/tools/validate.py"

      - name: Conformance fixtures (tools/run_scenarios.py)
        run: python tools/run_scenarios.py
